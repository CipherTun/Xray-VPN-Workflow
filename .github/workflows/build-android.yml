name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "release (signed) or debug (faster)"
        type: choice
        options: [release, debug]
        default: release
  push:
    branches: [main]
    paths-ignore: ["**.md", "assets/icon/preview.png"]
    tags: ["v*"]

permissions:
  contents: write   # needed to attach APKs to a release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  XRAY_CORE_TAG: v26.10.21   # Xray-core release to build into libXray
  LIBXRAY_TAG: v26.9.9       # XTLS/libXray tag used as the wrapper

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly: upload xray_vpn.zip to the repo root and this step unpacks it.
      # If the project files are already in the repo, the step does nothing.
      - name: Unpack project zip
        run: |
          if [ -f xray_vpn.zip ]; then
            rm -rf _src && mkdir _src && unzip -q xray_vpn.zip -d _src
            P="$(find _src -maxdepth 3 -name pubspec.yaml | head -1)"
            [ -n "$P" ] && cp -R "$(dirname "$P")"/. . 
            rm -rf _src
          fi
          test -f pubspec.yaml || { echo "::error::pubspec.yaml not found. Upload xray_vpn.zip to the repository root."; exit 1; }
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # ── Xray core (libXray.aar), cached by version ──
      - name: Cache libXray.aar
        id: aar
        uses: actions/cache@v4
        with:
          path: android-libs
          key: libxray-${{ env.LIBXRAY_TAG }}-${{ env.XRAY_CORE_TAG }}-v1

      - name: Build libXray.aar
        if: steps.aar.outputs.cache-hit != 'true'
        run: ./scripts/ci_build_libxray.sh

      # ── Project scaffolding, icons, geo files ──
      - name: Prepare Flutter project
        run: ./scripts/ci_prepare.sh

      # ── Signing ──
      # Preferred: add repo secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Otherwise a key is generated once and cached,
      # so updates keep installing over each other (as long as the cache is alive).
      - name: Restore cached signing key
        if: inputs.build_type != 'debug'
        id: keycache
        uses: actions/cache@v4
        with:
          path: ~/.xray-signing
          key: xray-signing-key-v1

      - name: Configure signing
        if: inputs.build_type != 'debug'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.xray-signing
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 --decode > ~/.xray-signing/release.jks
            STORE_PASS="$KS_PASS"; ALIAS="${KEY_ALIAS:-xray}"; KPASS="${KEY_PASS:-$KS_PASS}"
            echo "Using the keystore from repository secrets"
          elif [ -f ~/.xray-signing/release.jks ] && [ -f ~/.xray-signing/pass.txt ]; then
            STORE_PASS="$(cat ~/.xray-signing/pass.txt)"; ALIAS=xray; KPASS="$STORE_PASS"
            echo "Using the cached signing key"
          else
            STORE_PASS="$(openssl rand -hex 16)"; ALIAS=xray; KPASS="$STORE_PASS"
            keytool -genkeypair -v -keystore ~/.xray-signing/release.jks -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$STORE_PASS" -keypass "$KPASS" \
              -dname "CN=XRay VPN, O=io.surprise, C=US"
            echo "$STORE_PASS" > ~/.xray-signing/pass.txt
            echo "Generated a new signing key (cached for later builds)"
          fi
          cat > android/key.properties <<EOP
          storeFile=$HOME/.xray-signing/release.jks
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KPASS
          EOP
          sed -i 's/^ *//' android/key.properties

      # ── Checks (never blocks the build, read the log if the app misbehaves) ──
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ── Build ──
      - name: Build release APKs
        if: inputs.build_type != 'debug'
        run: |
          flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}
          flutter build apk --release --build-number ${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/XRayVPN-universal.apk
          for a in arm64-v8a armeabi-v7a x86_64; do
            f=build/app/outputs/flutter-apk/app-$a-release.apk
            [ -f "$f" ] && cp "$f" "dist/XRayVPN-$a.apk"
          done
          ls -la dist

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        run: |
          flutter build apk --debug --build-number ${{ github.run_number }}
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-debug.apk dist/XRayVPN-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: XRayVPN-apks
          path: dist/*.apk
          retention-days: 30

      - name: Attach to GitHub release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
