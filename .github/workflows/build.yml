name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Generate android/ so it doesn't need to be committed
      - run: flutter create --platforms=android --org com.example --project-name vpn_app .
      - run: python3 tools/patch_android.py
      - run: flutter pub get
      # One universal APK containing every ABI Flutter can build:
      # armeabi-v7a (32-bit ARM), arm64-v8a, x86_64
      - run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - uses: actions/upload-artifact@v4
        with:
          name: my-tunnel-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
